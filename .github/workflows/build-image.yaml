name: Build Image
on:
  pull_request:
    types: [opened, synchronize, closed]
    paths-ignore:
      - .github/**
      - .gitignore
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version to tag images with (e.g. 3.0.4)'
        required: true
      latest:
        description: 'Also tag the images as latest (false for older release lines)'
        type: boolean
        default: false

env:
  TUTOR_ROOT: ./.ci/

jobs:
  build:
    strategy:
      matrix:
        service:
          - name: aspects
            repository: edunext/aspects
          - name: aspects-superset
            repository: edunext/aspects-superset
          - name: openedx
            repository: edunext/openedx-aspects
    runs-on: ubuntu-latest
    if: "!startsWith(github.head_ref, 'dependabot/')"
    steps:
      - name: Log in to Docker Hub
        continue-on-error: true
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          username: ${{ secrets.EDUNEXT_DOCKER_USERNAME }}
          password: ${{ secrets.EDUNEXT_DOCKER_PASSWORD }}
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set outputs
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
      - name: Update ASPECTS_VERSION
        if: github.event.action == 'opened' || github.event.action == 'synchronize'
        run: |
          ASPECTS_VERSION=pr-${{ github.event.pull_request.number }}-${{ steps.vars.outputs.sha_short }}
          sed -i "s/ASPECTS_VERSION: .*/ASPECTS_VERSION: $ASPECTS_VERSION/" .ci/config.yml
      - name: Set ASPECTS_VERSION for release
        if: github.event_name == 'workflow_dispatch'
        run: |
          sed -i "s/ASPECTS_VERSION: .*/ASPECTS_VERSION: ${{ inputs.version }}/" .ci/config.yml
      - name: setup python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.12
      - name: Install aspects
        run: |
          pip install -r requirements/dev.txt
          pip install -e .
      - name: Save config
        run: tutor config save
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build Aspects Docker Images
        run: |
          tutor images build ${{ matrix.service.name }}
      - name: Push docker image
        continue-on-error: true
        if: github.event.action == 'opened' || github.event.action == 'synchronize' || (github.event_name == 'workflow_dispatch' && !inputs.latest)
        run: |
          tutor images push ${{ matrix.service.name }}
      - name: Push latest docker image
        continue-on-error: true
        if: github.event_name == 'workflow_dispatch' && inputs.latest
        run: |
          tutor images build ${{ matrix.service.name }} --cache-to-registry -d '--tag=${{ matrix.service.repository }}:latest'
          tutor images push ${{ matrix.service.name }}
          docker image push ${{ matrix.service.repository }}:latest
