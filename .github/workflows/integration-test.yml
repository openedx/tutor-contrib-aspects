    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6
        with:
          # this might remove tools that are actually needed,
          # if set to "true" but frees about 6 GB
          tool-cache: true

          # all of these default to true, but feel free to set to
          # "false" if necessary for your workflow
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: true
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
      - name: Point Tutor at the ghcr.io image cache
        run: .ci/tutor-ci-images.sh "ghcr.io/${{ github.repository }}"
      - name: Generate env
        run: |
          uv sync --locked --group dev --group ci
          # Keep ClickHouse small and skip services these jobs don't test: the k8s jobs share
          # one runner with the Kubernetes control plane.
          uv run tutor plugins enable ci_resources
          uv run tutor config save --set ASPECTS_XAPI_SOURCE=vector --set RUN_ASPECTS_DOCS=false
          uv run tutor config printvalue ASPECTS_XAPI_DATABASE | grep openedx
      - name: Run Kubernetes tools
        uses: stefanprodan/kube-tools@49504f5a42faa937ed11d7705b995416f8e55271 # v1
        with:
          kubectl: 1.23.0
          kustomize: 5.0.0
          helmv3: 3.7.2
          kubeconform: 0.4.13
          command: |
            kustomize build $TUTOR_ROOT/env | kubeconform -strict -ignore-missing-schemas -kubernetes-version 1.22.0
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin || \
            echo "::warning::ghcr.io login failed; pulling the image cache anonymously."
      - name: Tutor build openedx
        run: uv run tutor images build openedx aspects aspects-superset permissions
      - name: Stop the image builder
        run: |
          # The images are in the local Docker now; the BuildKit container and its cache would
          # otherwise hold memory and disk for the rest of the job.
          docker buildx prune --all --force
          docker buildx stop
      - name: Create k8s Kind Cluster
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
      - name: Mount docker image
        run: |
          kind get clusters
          kind load docker-image $(uv run tutor images printtag openedx) --name chart-testing
          kind load docker-image $(uv run tutor images printtag aspects) --name chart-testing
          kind load docker-image $(uv run tutor images printtag aspects-superset) --name chart-testing
          # kind has its own copies now.
          docker image rm $(uv run tutor images printtag openedx) $(uv run tutor images printtag aspects) \
            $(uv run tutor images printtag aspects-superset)
          df -h /
      - name: Setup namespace
        run: |
          kubectl config set-context --current --namespace=openedx
          kubectl get pods
      - name: Init k8s environment
        run: |
          uv run tutor k8s start
          # Only schedules Superset background tasks, which the tests don't use.
          kubectl scale deployment superset-worker-beat --replicas=0
          # The LMS has grown to ~9 GB here and taken the runner down with it. Cap it and the
          # CMS so a leak restarts that container (and shows as OOMKilled) instead.
          kubectl set resources deployment lms cms --limits=memory=3Gi
          uv run tutor k8s do init
      - name: Test alembic
        run: |
          uv run tutor k8s do alembic -c "downgrade base"
          uv run tutor k8s do alembic -c "upgrade head"
      - name: Init clickhouse
        run: uv run tutor k8s do init-clickhouse
      # This should:
      # 1. Run all models, since alembic test removed our state
      # 2. Find no models on the first run, state should now be up to date now
      # 3. Force run all models
      # 4. Successfully run tests
      - name: Test dbt
        run: |
          uv run tutor k8s do dbt -c "run"
          uv run tutor k8s do dbt -c "run"
          uv run tutor k8s do dbt --only_changed False -c "run"
          uv run tutor k8s do dbt --only_changed False -c "test"
      - name: Load test
        run: uv run tutor k8s do load-xapi-test-data
      - name: Check known answers
        run: uv run tutor k8s do check-known-answers
      - name: Import demo course
        run: uv run tutor k8s do importdemocourse
      - name: Test commands
        run: |
          uv run tutor k8s do dump-data-to-clickhouse --options "--object course_overviews --force"
          uv run make extract_translations
          uv run tutor k8s do import-assets
      - name: Performance metrics
        run: uv run tutor k8s do performance-metrics --fail_on_error
      - name: Runner and container resources
        if: always()
        run: |
          # Read straight from the kind node, so this works when the Kubernetes API doesn't.
          free -m; uptime; df -h /
          docker stats --no-stream
          docker exec chart-testing-control-plane crictl ps -a
          docker exec chart-testing-control-plane crictl stats -a
          # Why containers restarted, and what is using memory inside the LMS.
          for id in $(docker exec chart-testing-control-plane crictl ps -a -q); do
            docker exec chart-testing-control-plane crictl inspect "$id" \
              | jq -r '[.status.labels["io.kubernetes.pod.name"], .status.metadata.name, "restart \(.status.metadata.attempt)", .status.state, .status.reason, .status.exitCode] | @tsv' 2>/dev/null
          done | grep -v -- '-job-' | sort
          # The open-files limit containers get, which sizes uWSGI's tables.
          for id in $(docker exec chart-testing-control-plane crictl ps --name '^lms-worker$' -q); do
            docker exec chart-testing-control-plane crictl exec "$id" grep "open files" /proc/1/limits
          done
          # Why Superset restarts: the end of its last exited container's log.
          for id in $(docker exec chart-testing-control-plane crictl ps -a --state exited --name '^superset$' -q | head -1); do
            docker exec chart-testing-control-plane crictl logs --tail 30 "$id" 2>&1
          done
          for id in $(docker exec chart-testing-control-plane crictl ps --name '^lms$' -q); do
            # Resident memory (kB) and command of each process; the image may not have ps.
            docker exec chart-testing-control-plane crictl exec "$id" sh -c \
              'for d in /proc/[0-9]*; do echo "$(awk "/VmRSS/ {print \$2}" $d/status 2>/dev/null) $(tr "\0" " " < $d/cmdline 2>/dev/null | cut -c1-150)"; done | sort -rn | head -15'
          done
      - name: Container logs from the kind node
        if: failure()
        run: |
          NODE=chart-testing-control-plane
          docker exec $NODE dmesg | grep -iE 'out of memory|oom-kill|killed process' | tail -20 || true
          for name in clickhouse superset kube-apiserver; do
            for id in $(docker exec $NODE crictl ps -a --name "^${name}\$" -q); do
              echo "::group::${name} ${id}"
              docker exec $NODE crictl logs --tail 200 "$id" 2>&1
              echo "::endgroup::"
            done
          done
      - name: Check failure logs
        if: failure()
        run: |
          # Use an array to store pod names
          pod_list=($(kubectl get pods -o jsonpath='{.items[*].metadata.name}'))

          failed_jobs=""

          # Loop through each pod and check for failure
          for pod_name in "${pod_list[@]}"; do
            # Get the pod phase/status
            pod_phase=$(kubectl get pod "$pod_name" -o jsonpath='{.status.phase}')

            if [[ "$pod_phase" != "Running" && "$pod_phase" != "Succeeded" ]]; then
              # Job is not in Running or Succeeded state, consider it as failed
              failed_jobs="$failed_jobs $pod_name"
              # Print the logs for the failing pod
              echo "Failure logs for pod: $pod_name"
              kubectl logs "$pod_name"
            fi
          done

          # Check if any jobs failed
          if [ -n "$failed_jobs" ]; then
            echo "The following jobs failed: $failed_jobs"
          else
            echo "All jobs succeeded."
          fi
      - name: Check service logs
        if: failure()
        run: |
          # Use an array to store service names
          service_list=($(kubectl get services -o jsonpath='{.items[*].metadata.name}'))

          # Loop through each service and print logs
          for service_name in "${service_list[@]}"; do
            echo "Logs for service: $service_name"
            kubectl logs "svc/$service_name"
            echo "------------------------"
          done
      - name: Check jobs logs
        if: "!cancelled()"
        run: |
          job_list=($(kubectl get jobs | grep job | awk '{print $1}'))

          # Function to print logs for a pod
          print_pod_logs() {
            local pod_name="$1"
            echo "Logs for pod: $pod_name"
            kubectl logs "$pod_name"
            echo "------------------------"
          }

          # Loop through each job-related pod and print logs
          for job_name in "${job_list[@]}"; do
            # Get the pods related to the current job
            job_pod_list=($(kubectl get pods | grep -E "${job_name}-.*" | awk '{print $1}'))

            for pod_name in "${job_pod_list[@]}"; do
              print_pod_logs "$pod_name"
            done
          done
