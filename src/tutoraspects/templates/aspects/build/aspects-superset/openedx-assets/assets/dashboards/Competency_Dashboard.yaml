    id: HEADER_ID
    meta:
      text: Competency Dashboard
    type: HEADER
  MARKDOWN-competency-count:
    children: []
    id: MARKDOWN-competency-count
    meta:
      code: '### Mastery Status Count (#407)


        *Learners by mastery status*


        **Chart:** stacked bar


        - **X:** competency

        - **Y:** learners, `count(distinct actor_id)`

        - **Stack:** Available, Partially Attempted, Not Demonstrated, Demonstrated

        - **Control:** status multi-select


        **Colours:** Available `#CBD5E1`, Partially Attempted `#0A67A3`, Not Demonstrated `#741420`, Demonstrated `#3FA36F`


        **Data:** `student_competency_status` sink; Available = enrolled in a course assessing the competency, with no status

        '
      height: 60
      width: 6
    parents:
    - ROOT_ID
    - GRID_ID
    - ROW-competency-3
    type: MARKDOWN
  MARKDOWN-competency-filters:
    children: []
    id: MARKDOWN-competency-filters
    meta:
      code: '### Filters (#406)


        Native filters go here once datasets exist. Every box below responds to all four.


        - **Organization**: the course''s org

        - **Competency**: competency tags only; selecting one also selects its parents and children (#435)

        - **Course**: courses that assess the competency

        - **Pathway**: courses in the pathway (gated on Epic 1 phase 2)

        '
      height: 34
      width: 12
    parents:
    - ROOT_ID
    - GRID_ID
    - ROW-competency-1
    type: MARKDOWN
  MARKDOWN-competency-log:
    children: []
    id: MARKDOWN-competency-log
    meta:
      code: '### Learner Competency Mastery (#409)


        **Chart:** table, PII; sortable columns; default sort Competency, then Name


        **Controls:** Status filter, learner search, pagination


        | Name | Username | Email address | Competency | Competency Status | First Attempt | Mastery Date |

        |---|---|---|---|---|---|---|

        | *dim_user_pii* | *dim_user_pii* | *dim_user_pii* | *competency tag* | *status* | *first activity* | *Demonstrated date, empty otherwise* |


        **Grain:** one row per learner x competency, Available included


        **Data:** `student_competency_status` sink + `dim_user_pii`

        '
      height: 50
      width: 12
    parents:
    - ROOT_ID
    - GRID_ID
    - ROW-competency-7
    type: MARKDOWN
  MARKDOWN-competency-overtime:
    children: []
    id: MARKDOWN-competency-overtime
    meta:
      code: '### Competencies Mastered Over Time (#410)


        *Cumulative count of competencies demonstrated*


        **Chart:** area, cumulative


        - **X:** time; grain hours, days, weeks or months; range selectable

        - **Y:** cumulative learner-competency pairs that reached Demonstrated


        **Data:** `modified` of `student_competency_status` rows at Demonstrated (statuses only rise, so it never moves again)

        '
      height: 60
      width: 6
    parents:
    - ROOT_ID
    - GRID_ID
    - ROW-competency-5
    type: MARKDOWN
  MARKDOWN-competency-pct:
    children: []
    id: MARKDOWN-competency-pct
    meta:
      code: '### Mastery Status % Breakdown (#408)


        *Share of enrolled learners in each status*


        **Chart:** grouped bar


        - **X:** competency

        - **Y:** % of learners

        - **Group:** status (same four as the count chart)


        **Denominator:** learners enrolled in some course that assesses the competency. Percentages sum to 100% per competency.


        **Data:** same model as Mastery Status Count

        '
      height: 60
      width: 6
    parents:
    - ROOT_ID
    - GRID_ID
    - ROW-competency-3
    type: MARKDOWN
  MARKDOWN-competency-sec-details:
    children: []
    id: MARKDOWN-competency-sec-details
    meta:
      code: '## Mastery Details'
      height: 8
      width: 12
    parents:
    - ROOT_ID
    - GRID_ID
    - ROW-competency-4
    type: MARKDOWN
  MARKDOWN-competency-sec-log:
    children: []
    id: MARKDOWN-competency-sec-log
    meta:
      code: '## Learner Mastery and Assessment Log


        *Entire section hidden when PII is off.*'
      height: 12
      width: 12
    parents:
    - ROOT_ID
    - GRID_ID
    - ROW-competency-6
    type: MARKDOWN
  MARKDOWN-competency-sec-status:
    children: []
    id: MARKDOWN-competency-sec-status
    meta:
      code: '## Mastery Status'
      height: 8
      width: 12
    parents:
    - ROOT_ID
    - GRID_ID
    - ROW-competency-2
    type: MARKDOWN
  MARKDOWN-competency-timeto:
    children: []
    id: MARKDOWN-competency-timeto
    meta:
      code: '### Time to Mastery (#411)


        *Time from first activity to demonstration*


        **Chart:** box plot


        - **X:** competency

        - **Y:** time to mastery; grain hours, days, weeks or months

        - **Legend:** interquartile range, median, min / max


        **Start:** first recorded activity on content tagged with the competency (xAPI)


        **End:** mastery date, as in Competencies Mastered Over Time

        '
      height: 60
      width: 6
    parents:
    - ROOT_ID
    - GRID_ID
    - ROW-competency-5
    type: MARKDOWN
